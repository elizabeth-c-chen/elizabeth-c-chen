name: generate snake animation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" 
    - cron: "0 5 * * *"
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 21 * * *"
 
  push:
    branches:
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: checkout repository 
        uses: actions/checkout@v4

      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3.3.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=black
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-pink.svg?color_snake=black&color_dots=#e6e9ed,#FFDBFE,#FE99F7,#FD56F0,#FC14E9 
            dist/github-snake-blue.svg?color_snake=black&color_dots=#e6e9ed,#C5D0FA,#99AFFE,#567DFD,#144AFC
            dist/github-snake-purple.svg?color_snake=black&color_dots=#e6e9ed,#FADBFF,#DC99FE,#BE56FD,#A014FC

      - name: commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution snake animation"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"